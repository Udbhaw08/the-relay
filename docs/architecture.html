<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Overview - The Relay</title>
  <style>
    body {
      background-color: #0e1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      max-width: 950px;
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 600;
      color: #f0f6fc;
      border-bottom: 1px solid #21262d;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .svg-container {
      width: 100%;
      display: flex;
      justify-content: center;
      background: #0d1117;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #21262d;
      overflow-x: auto;
    }
    .svg-container img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Architecture Overview</h1>
    <div class="svg-container">
      <img src="architecture_diagram.svg" alt="System Architecture Diagram" />
    </div>
  </div>
</body>
</html>
